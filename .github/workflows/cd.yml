name: CD

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: mlops-oppe-492409
  REGION: asia-south1
  REPOSITORY: heart-repo
  IMAGE_NAME: heart-api
  DEPLOYMENT_NAME: heart-api
  CONTAINER_NAME: heart-api
  CLUSTER_NAME: heart-cluster
  CLUSTER_LOCATION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          gcloud builds submit --tag "${IMAGE_URI}" .

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Deploy new image to GKE
        run: |
          kubectl set image deployment/${DEPLOYMENT_NAME} ${CONTAINER_NAME}=${IMAGE_URI}
          kubectl rollout status deployment/${DEPLOYMENT_NAME}

      - name: Verify deployment
        run: |
          kubectl get deployment ${DEPLOYMENT_NAME}
          kubectl get pods -l app=${DEPLOYMENT_NAME}
